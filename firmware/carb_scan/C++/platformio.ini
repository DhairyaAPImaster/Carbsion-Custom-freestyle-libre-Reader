[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    bblanchon/ArduinoJson
    https://github.com/ATrappmann/PN5180-Library.git

build_flags =
    -DCORE_DEBUG_LEVEL=3
